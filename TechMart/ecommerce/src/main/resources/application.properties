spring.application.name=ecommerce-backend

server.port=8080

# ============================================================
# Database - Amazon RDS MySQL
# ============================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# Admin
# ============================================================

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}


# ============================================================
# Amazon S3
# ============================================================

app.s3.bucket-name=${APP_S3_BUCKET_NAME}
app.s3.region=${APP_S3_REGION:ap-southeast-1}

app.s3.presigned-url-expiration-minutes=${APP_S3_PRESIGNED_URL_EXPIRATION_MINUTES:60}

# ============================================================
# Multipart File Upload
# ============================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
